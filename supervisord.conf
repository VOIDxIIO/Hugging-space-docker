[supervisord]
nodaemon=true
user=user
pidfile=/tmp/supervisord.pid
logfile=/tmp/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3

[program:xvfb]
command=Xvfb :1 -screen 0 %(ENV_RESOLUTION)s -ac +extension GLX +render -noreset
priority=10
autorestart=true
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb.log

[program:openbox]
command=openbox --config-file /home/user/.config/openbox/rc.xml
priority=20
environment=DISPLAY=":1"
autorestart=true
stdout_logfile=/tmp/openbox.log
stderr_logfile=/tmp/openbox.log

[program:x11vnc]
command=x11vnc -display :1 -forever -shared -rfbport 5900 %(ENV_X11VNC_AUTH_FLAG)s -noxrecord -noxfixes -noxdamage -wait 5
priority=30
environment=DISPLAY=":1"
autorestart=true
stdout_logfile=/tmp/x11vnc.log
stderr_logfile=/tmp/x11vnc.log

[program:websockify]
command=websockify --web /usr/share/novnc 6080 127.0.0.1:5900
priority=40
autorestart=true
stdout_logfile=/tmp/websockify.log
stderr_logfile=/tmp/websockify.log

[program:chromium]
command=/home/user/app/start-browser.sh
priority=50
environment=DISPLAY=":1",HOME="/home/user"
autorestart=true
stdout_logfile=/tmp/chromium.log
stderr_logfile=/tmp/chromium.log

[program:dashboard]
command=python3 /home/user/app/dashboard/app.py
priority=60
autorestart=true
stdout_logfile=/tmp/dashboard.log
stderr_logfile=/tmp/dashboard.log

[program:nginx]
command=nginx -c /home/user/app/nginx.conf
priority=70
autorestart=true
stdout_logfile=/tmp/nginx_proc.log
stderr_logfile=/tmp/nginx_proc.log
